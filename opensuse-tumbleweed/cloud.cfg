disable_root: false
preserve_hostname: false
syslog_fix_perms: root:root
mount_default_fields: [~, ~, 'auto', 'defaults', '0', '2']

datasources_list: [None]

cloud_init_modules:
 - migrator
 - bootcmd
 - write-files
 - growpart
 - resizefs
 - disk_setup
 - mounts
 - set_hostname
 - update_hostname
 - update_etc_hosts
 - rsyslog
 - users-groups
 - ssh

cloud_config_modules:
 - locale
 - set-passwords
 - timezone
 - resolv_conf
 - ntp
 - zypper_add_repo
 - disable-ec2-metadata
 - runcmd

cloud_final_modules:
 - salt-minion
 - scripts-vendor
 - scripts-per-once
 - scripts-per-boot
 - scripts-per-instance
 - scripts-user
 - phone-home
 - final-message
 - power-state-change

system_info:
   distro: opensuse-microos
   ssh_svcname: sshd
   paths:
      cloud_dir: /var/lib/cloud/
      templates_dir: /etc/cloud/templates/
